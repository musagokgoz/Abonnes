name: Build GitHub Pages docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          VITE_SUPABASE_URL: https://mtmbjfkomeztootimvew.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tzR683A5C5MRbbMt1eYjnQ_bFtm1Mgz
      - name: Update docs output
        run: |
          rm -rf docs
          cp -R dist docs
          touch docs/.nojekyll
      - name: Commit docs output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs
          git diff --cached --quiet || git commit -m "Deploy docs output [skip ci]"
          git push
